name: Quality
run-name: >-
  ${{ github.event_name == 'pull_request' && format('L1 PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.head.sha) || 'L1 merge group' }}

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: L1-Fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RSI_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      RSI_CI_HEAD_SHA: ${{ github.sha }}
    outputs:
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Classify changed paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-renames --name-only -z "$RSI_CI_BASE_SHA" "$RSI_CI_HEAD_SHA" -- > "$RUNNER_TEMP/quality-paths"
          docs=true
          package=false
          bridge=false
          while IFS= read -r -d '' path; do
            case "$path" in docs/*|*.md) ;; *) docs=false ;; esac
            case "$path" in src/*|web/*|scripts/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig*.json|.github/workflows/ci.yml) package=true ;; esac
            case "$path" in .github/workflows/bridge/*|.github/workflows/bridge.yml) bridge=true ;; esac
          done < "$RUNNER_TEMP/quality-paths"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "bridge=$bridge" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile ${{ steps.scope.outputs.docs == 'true' && '--ignore-scripts' || '' }}
      - name: Run documentation checks
        if: steps.scope.outputs.docs == 'true'
        run: pnpm check:docs
      - name: Run full checks
        if: steps.scope.outputs.docs != 'true'
        run: pnpm check
      - name: Run bridge tests
        if: steps.scope.outputs.bridge == 'true'
        run: python3 -m unittest discover -s .github/workflows/bridge/tests

  package:
    name: L1-Heavy / package
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Report path decision
        if: needs.fast.outputs.package != 'true'
        run: echo "No package inputs changed."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.fast.outputs.package == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.fast.outputs.package == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: needs.fast.outputs.package == 'true'
      - if: needs.fast.outputs.package == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.fast.outputs.package == 'true'
        run: pnpm check:package

  windows:
    name: L1-Heavy / test-windows
    needs: fast
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

name: Quality
run-name: >-
  ${{ github.event_name == 'pull_request' && format('L1 PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.head.sha) || 'L1 merge group' }}

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CI / Detect changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RSI_CI_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      RSI_CI_HEAD_SHA: ${{ github.sha }}
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      package: ${{ steps.scope.outputs.package }}
      bridge: ${{ steps.scope.outputs.bridge }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Classify changed paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The merge ref can be rebuilt on a newer base than the event payload.
            RSI_CI_BASE_SHA=$(git rev-parse "$RSI_CI_HEAD_SHA^1")
          fi
          git diff --no-renames --name-only -z "$RSI_CI_BASE_SHA" "$RSI_CI_HEAD_SHA" -- > "$RUNNER_TEMP/quality-paths"
          docs=true
          if [[ ! -s "$RUNNER_TEMP/quality-paths" ]]; then docs=false; fi
          package=false
          bridge=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*) ;;
              */*) docs=false ;;
              *.md) ;;
              *) docs=false ;;
            esac
            case "$path" in src/*|web/*|scripts/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig*.json|.github/workflows/ci.yml) package=true ;; esac
            case "$path" in .github/workflows/bridge/*|.github/workflows/bridge.yml|.github/workflows/ci.yml) bridge=true ;; esac
          done < "$RUNNER_TEMP/quality-paths"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "bridge=$bridge" >> "$GITHUB_OUTPUT"
          echo "base_sha=$RSI_CI_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$RSI_CI_HEAD_SHA" >> "$GITHUB_OUTPUT"

  check:
    name: CI / Check (Linux)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RSI_CI_BASE_SHA: ${{ needs.scope.outputs.base_sha }}
      RSI_CI_HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile ${{ needs.scope.outputs.docs == 'true' && '--ignore-scripts' || '' }}
      - name: Run documentation checks
        if: needs.scope.outputs.docs == 'true'
        run: pnpm check:docs
      - name: Run full checks
        if: needs.scope.outputs.docs != 'true'
        run: pnpm check
      - name: Run bridge tests
        if: needs.scope.outputs.bridge == 'true'
        run: python3 -m unittest discover -s .github/workflows/bridge/tests

  package:
    name: CI / Package
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Report path decision
        if: needs.scope.outputs.package != 'true'
        run: echo "No package inputs changed."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.scope.outputs.package == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: needs.scope.outputs.package == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.scope.outputs.package == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: needs.scope.outputs.package == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.scope.outputs.package == 'true'
        run: pnpm check:package

  windows_shard:
    name: CI / Test (Windows ${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.docs != 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit test shard
        shell: bash
        run: node --import tsx --test --test-shard=${{ matrix.shard }}/3 tests/unit/*.test.ts tests/unit/*.test.mjs

  windows:
    name: CI / Test (Windows)
    needs: [scope, windows_shard]
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Windows test results
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS: ${{ needs.scope.outputs.docs }}
          SHARD_RESULT: ${{ needs.windows_shard.result }}
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "::error::Change detection did not succeed ($SCOPE_RESULT)."
            exit 1
          elif [[ "$DOCS" == true ]]; then
            echo "Only documentation changed."
          elif [[ "$SHARD_RESULT" == success ]]; then
            echo "All three Windows test shards passed."
          else
            echo "::error::Windows test shards did not succeed ($SHARD_RESULT)."
            exit 1
          fi

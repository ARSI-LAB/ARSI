schemaVersion: rsi.target/v1
id: target.kernel-opt
entries:
  # The agent proposer rewrites the captured kernel source; one structural
  # change per candidate, evaluated under the evaluator's validity gate.
  # The SDK evaluator loads input.py and calls its kernel_function with the
  # task contract inputs.
  - path: input.py
    kind: file
    description: Captured kernel source; the proposer returns one optimized variant per round.
    changes: [modify]
    content:
      encoding: utf-8
  # Numeric entry point (tiling/block parameters) read by the kernel wrapper.
  - path: config.json
    kind: file
    description: Kernel configuration parameters as finite integer arguments.
    changes: [modify]
    content:
      encoding: utf-8
      maxBytes: 4096
constraints:
  # Wide enough for one complete kernel rewrite; prevents proposer output blowup.
  maxChangedFiles: 8
  maxChangedBytes: 131072

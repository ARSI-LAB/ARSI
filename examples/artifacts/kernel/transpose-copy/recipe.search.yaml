schemaVersion: rsi.recipe/v1
id: operator-transpose-copy-metrics-search
application:
  plugin: application.kernel
  config:
    entryFile: input.py
    target:
      schema: ./target.yaml
    baseline:
      directory: ./baseline
policy:
  id: policy.operator-search
  config:
    goal:
      Improve the Triton-Ascend transpose-copy kernel using static analysis followed by
      measured bottleneck analysis while preserving the complete task contract.
    caseIds:
      - fixed
    maxAttempts: 3
    repairLimit: 3
    metricsEnabled: true
    maxRounds: 10
    maxNoImprovement: 5
bindings:
  agent:
    plugin: agent.pi
    config:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      api_key: ${MODEL_API_KEY}
      retries: 0
  proposer:
    plugin: proposer.operator
    config:
      promptsDirectory: ./prompts
      hardwareContextFile: ./hardware-context.md
      modelRequestTimeoutMs: 120000
      agentRef: agent
      task:
        directory: ./task
      embedding:
        python: REPLACE_WITH_EXPLICIT_EMBEDDING_PYTHON
        modelDirectory: REPLACE_WITH_DEPLOYED_MODEL_DIRECTORY
        identityFile: REPLACE_WITH_EMBEDDING_IDENTITY_FILE
        device: cpu
        timeoutMs: 300000
        similarityThreshold: 0.6
        resourcesDirectory: REPLACE_WITH_EXTERNAL_KNOWLEDGE_BUNDLE
        retrievalScript: REPLACE_WITH_EXTERNAL_RETRIEVAL_WORKER
  summarizer:
    plugin: summarizer.operator
    config:
      agentRef: agent
      promptFile: ./prompts/summarize.md
  evaluator:
    plugin: evaluator.operatorbench
    config:
      task:
        directory: ./task
      benchmark:
        name: kernel
        config:
          python: REPLACE_WITH_EXPLICIT_SDK_PYTHON
          device: 0
          timeoutSeconds: 900
          warmup: 5
          repeat: 20
          rtol: 0
          atol: 0
          profiling:
            enabled: false
            collection: Default
            warmup: 25
            cacheEnabled: false
            maxAttempts: 2
            attemptTimeoutSeconds: 300
            roundNum: 1
      run:
        timeoutSeconds: 930
        onError: abort
  selector:
    plugin: selector.metric
    config:
      metric: latencyMeanMs
      direction: minimize
      eligibility:
        - metric: candidateValid
          min: 1
      minRelativeImprovement: 0.02
budget:
  operations: 1024
  evaluationRuns: 65
  modelCalls: 152
  elapsedWallMs: 7200000
  cleanupReserveMs: 60000

      testTaskIds: []
bindings:
  evaluator:
    plugin: evaluator.gym
    config:
      baseUrl: ${GYM_BASE_URL}
      requestDefaults:
        adapter: dsh_candidate
        benchmark: gaia_text_validation
        split: train_full
        tier: screen
        # A new seed avoids replaying the failed eval-26257179c297408b cache.
        # Baseline and candidate evaluations all use this same seed.
        seed: 48
      poll:
        intervalMs: 5000
        timeoutMs: 7200000
      budget:
        # 36 task rows; Gym applies --num-repeats after --limit, so this is 72 rollouts.
        maxRollouts: 36
        timeoutS: 7200
      # evaluator.gym and release.gym depend only on this harness-owned publish
      # port. Switching AgentBundle kinds changes this block, not the core.
      publish:
        kind: dsh-user-layer
        dshHome: ${DSH_HOME}
        profileName: headless
        basePatch: ${RSI_DSH_BASE_PATCH}
        bundleKinds: [dsh-agent-bundle]
  release:
    plugin: release.gym
    config:
      baseUrl: ${GYM_BASE_URL}
      promotionDefaults:
        adapter: dsh_candidate
        benchmark: gaia_text_validation
        seed: 48
      poll:
        intervalMs: 5000
        timeoutMs: 7200000
      minDelta: 0
      metric: successRate
      publish:
        kind: dsh-user-layer
        dshHome: ${DSH_HOME}
        profileName: headless
        basePatch: ${RSI_DSH_BASE_PATCH}
        bundleKinds: [dsh-agent-bundle]
budget:
  elapsedWallMs: 14400000

schemaVersion: rsi.recipe/v1
id: dsh-wikiskill
application:
  plugin: application.agentbundle
  config:
    target: { schema: ./target.yaml }
    baseline: { directory: ./baseline }
policy:
  id: policy.wikiskill
  config:
    maxRounds: 3
    dataset:
      # Keep all ten IDs distinct across training, validation and independent test.
      trainTaskIds:
        - terminal-bench/html-js-filter
        - terminal-bench/interleaved-vigenere
        - terminal-bench/data-anonymization
        - terminal-bench/coq-block-bound
        - terminal-bench/payments-pipeline-fix
        - terminal-bench/session-window-debug
      validationTaskIds:
        - terminal-bench/formal-crypto
        - terminal-bench/wal-recovery-ordering
      # Final reporting only; these tasks must not contribute to Wiki learning.
      testTaskIds:
        - terminal-bench/bun-sourcemap-leak
        - terminal-bench/react-lead-form

bindings:
  agent:
    plugin: agent.pi
    config:
      # Optimizer output tokens and time per model request (ms).
      maxTokens: 32768
      timeoutMs: 600000
  memoryUpdater:
    config:
      # Model-call cap sent to the Agent for each Memory operation.
      maxModelCalls: 24
  evaluator:
    plugin: evaluator.agentbench
    config:
      services:
        default:
          model: ${MODEL_NAME}
          maxTokens: 65536
          base_url: ${MODEL_ENDPOINT}
          api_key: ${MODEL_API_KEY}
      benchmark:
        name: terminalbench
        version: '4.0'
      # The official prebuilt task images use amd64, including on ARM64 hosts.
      environment:
        platform: linux/amd64
      scheduler:
        name: local
        concurrency: 5
      run:
        timeoutSeconds: 3600
budget:
  operations: 400
  evaluationRuns: 8
  modelCalls: 160
  elapsedWallMs: 172800000
  cleanupReserveMs: 60000

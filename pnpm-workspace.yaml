# Explicitly allow the esbuild installation required by the test runner.
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
  'ember-evaluator@git+https://github.com/evolving-foundry/ember-evaluator.git': true
  'agent-bundle-core@git+https://github.com/evolving-foundry/agentbundle.git': true
  'agentbundle-workspace@git+https://github.com/evolving-foundry/agentbundle.git': true
overrides:
  agent-bundle-core: 'git+https://github.com/evolving-foundry/agentbundle.git#0.0.1&path:/packages/core'
nodeLinker: hoisted
blockExoticSubdeps: false

schemaVersion: rsi.policy/v1
id: policy.gym-rsi
description: Run the Gym-RSI closed loop. WikiSkill search uses train_full training and validation tasks, then Gym holdout promotion compares the final candidate with the original incumbent.
input_schema:
  $ref: ../../contracts/policies/candidate-input.yaml
input:
  candidateRef: ${{ application.initialCandidate }}
config_schema:
  $ref: ./schemas/config.yaml
state_schema:
  type: object
  properties:
    incumbent:
      type: string
      minLength: 1
    measurement:
      type:
        - string
        - 'null'
    initialMeasurement:
      type:
        - string
        - 'null'
    round:
      type: integer
      minimum: 0
    score:
      type:
        - number
        - 'null'
    initial:
      type: string
      minLength: 1
    promotion:
      type:
        - object
        - 'null'
  required:
    - incumbent
    - measurement
    - initialMeasurement
    - round
    - score
    - initial
    - promotion
  additionalProperties: false
state:
  incumbent: ${{ input.candidateRef }}
  measurement: null
  initialMeasurement: null
  round: 0
  score: null
  initial: ${{ input.candidateRef }}
  promotion: null
output_schema:
  $ref: ./schemas/optimization-result.yaml
require:
  agent:
    contract: contract.agent
  proposer:
    contract: contract.proposer
  evaluator:
    contract: contract.gym
  selector:
    contract: contract.selector-metrics
  promotion:
    contract: contract.gym
defaults:
  memory: { configFile: ./memory.yaml }
  reflection: { configFile: ./reflection.yaml }
  bindings:
    agent:
      plugin: agent.pi
      config:
        model: ${MODEL_NAME}
        base_url: ${MODEL_ENDPOINT}
        api_key: ${MODEL_API_KEY}
        retries: 3
        retryBaseDelayMs: 2000
    proposer:
      plugin: proposer.agent
      config:
        agentRef: agent
        prompt: ../wikiskill/proposer.md
        evidenceView: training-summary
    selector:
      plugin: selector.metric
      config:
        metric: successRate
        direction: maximize
steps:
  # A duplicate key fails the foreach step, so this declares train/validation
  # without adding a speculative set-difference expression to the DSL.
  - id: validate_disjoint_splits
    type: foreach
    foreach: ${{ concat(config.dataset.trainTaskIds,
      config.dataset.validationTaskIds) }}
    as: taskId
    key: ${{ taskId }}
    concurrency: 1
    steps: []
  - id: baseline
    type: invoke
    use: evaluator
    with:
      action: evaluate
      candidateRef: ${{ state.incumbent }}
      taskIds: ${{ config.dataset.validationTaskIds }}
  - id: save_baseline
    type: state
    state:
      initialMeasurement: ${{ steps.baseline.output.measurementRef }}
      measurement: ${{ steps.baseline.output.measurementRef }}
  - id: check_baseline_threshold
    type: if
    if: ${{ config.stopAtScore != null }}
    then:
      steps:
        - id: baseline_score
          type: invoke
          use: selector
          with:
            incumbentMeasurementRef: ${{ state.measurement }}
            candidateMeasurementRef: ${{ state.measurement }}
        - id: save_baseline_score
          type: state
          state:
            score: ${{ steps.baseline_score.output.selectedValue }}
  - id: search
    type: loop
    maxIterations: ${{ config.maxRounds }}
    while: ${{ config.stopAtScore == null || state.score < config.stopAtScore }}
    steps:
      - id: train
        type: invoke
        use: evaluator
        with:
          action: evaluate
          candidateRef: ${{ state.incumbent }}
          taskIds: ${{ config.dataset.trainTaskIds }}
      - id: propose
        type: invoke
        use: proposer
        with:
          parent: ${{ state.incumbent }}
          goal:
            Improve reusable skills using observed training outcomes and Wiki
            evidence, while preserving unrelated behavior.
          evidenceRefs:
            - ${{ steps.train.output.measurementRef }}
      - id: no_change
        type: if
        if: ${{ steps.propose.output.status == 'no-change' }}
        then:
          steps:
            - id: next_round
              type: control
              control: continue
      # Validation ties advance the candidate to the Gym holdout gate; only a
      # strictly worse candidate is rejected here.
      - id: validate
        type: invoke
        use: evaluator
        with:
          action: evaluate
          candidateRef: ${{ steps.propose.output.candidateRef }}
          taskIds: ${{ config.dataset.validationTaskIds }}
      - id: select
        type: invoke
        use: selector
        with:
          incumbentMeasurementRef: ${{ state.measurement }}
          candidateMeasurementRef: ${{ steps.validate.output.measurementRef }}
      - id: save_feedback
        type: state
        state:
          score: ${{ steps.select.output.selectedValue }}
      - id: adopt
        type: if
        if: ${{ steps.select.output.accepted || (steps.select.output.candidateFeasible && steps.select.output.candidateValue == steps.select.output.incumbentValue) }}
        then:
          steps:
            - id: save
              type: state
              state:
                incumbent: ${{ steps.propose.output.candidateRef }}
                measurement: ${{ steps.validate.output.measurementRef }}
  - id: promotion
    type: invoke
    use: promotion
    with:
      action: promote
      candidateRef: ${{ state.incumbent }}
      incumbentRef: ${{ state.initial }}
  - id: save_promotion
    type: state
    state:
      promotion:
        decision: ${{ steps.promotion.output.decision }}
        reason: ${{ steps.promotion.output.reason }}
        promotionRef: ${{ steps.promotion.output.promotionRef }}
output:
  candidateRef: "${{ state.promotion.decision == 'promote' ? state.incumbent : state.initial }}"
  searchCandidateRef: ${{ state.incumbent }}
  effectiveRef: "${{ state.promotion.decision == 'promote' ? state.incumbent : state.initial }}"
  searchMeasurementRef: ${{ state.measurement }}
  measurementRef: "${{ state.promotion.decision == 'promote' ? state.measurement : state.initialMeasurement }}"
  promotionDecision: ${{ state.promotion.decision }}
  promotionReason: ${{ state.promotion.reason }}
  promotionRef: ${{ state.promotion.promotionRef }}

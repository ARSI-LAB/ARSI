type: object
properties:
  k:
    x-rsi-tunable: true
    type: integer
    minimum: 1
    maximum: 10
    default: 1
  concurrency:
    description: Maximum concurrent exploration slots within each task.
    type: integer
    minimum: 1
    maximum: 64
    default: 1
  dataset:
    type: object
    properties:
      taskIds:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
        uniqueItems: true
    required:
      - taskIds
    additionalProperties: false
  memory:
    type: boolean
    default: true
required:
  - dataset
additionalProperties: false

schemaVersion: rsi.policy/v1
id: policy.operator-baseline
config_schema:
  $ref: ./schemas/config.yaml
input_schema:
  $ref: ../../contracts/policies/candidate-input.yaml
output_schema:
  $ref: ./schemas/result.yaml
input:
  candidateRef: ${{ application.initialCandidate }}
require:
  evaluator:
    contract: contract.operatorbench
  selector:
    contract: contract.selector-metrics
output:
  bestCandidateRef: ${{ input.candidateRef }}
  bestMeasurementRef: ${{ steps.evaluate_baseline.output.measurementRef }}
  finalMeasurementRef: ${{ steps.evaluate_final.output.measurementRef }}
  finalDecisionRef: ${{ steps.check_final.output.decisionRef }}
  finalValidity: ${{ if(steps.check_final.output.candidateFeasible, 'valid', 'invalid') }}
  stopReason: baseline-only
  attempts: []
steps:
  - id: evaluate_baseline
    use: evaluator
    with:
      action: evaluate
      candidateRef: ${{ input.candidateRef }}
      caseIds: ${{ config.caseIds }}
    type: invoke
  - id: check_baseline
    use: selector
    with:
      incumbentMeasurementRef: ${{ steps.evaluate_baseline.output.measurementRef }}
      candidateMeasurementRef: ${{ steps.evaluate_baseline.output.measurementRef }}
    type: invoke
  - id: evaluate_final
    use: evaluator
    with:
      action: evaluate
      candidateRef: ${{ input.candidateRef }}
      caseIds: ${{ config.caseIds }}
    type: invoke
  - id: check_final
    use: selector
    with:
      incumbentMeasurementRef: ${{ steps.evaluate_baseline.output.measurementRef }}
      candidateMeasurementRef: ${{ steps.evaluate_final.output.measurementRef }}
    type: invoke

schemaVersion: rsi.policy/v1
id: policy.operator-diagnostic
config_schema:
  $ref: ./schemas/config.yaml
input_schema:
  $ref: ../../contracts/policies/candidate-input.yaml
output_schema:
  $ref: ./schemas/result.yaml
input:
  candidateRef: ${{ application.initialCandidate }}
require:
  evaluator:
    contract: contract.operatorbench
  selector:
    contract: contract.selector-metrics
output:
  bestCandidateRef: ${{ input.candidateRef }}
  bestMeasurementRef: ${{ steps.evaluate_baseline.output.measurementRef }}
  finalMeasurementRef: null
  finalDecisionRef: null
  finalValidity: not-run
  stopReason: diagnostic-only
  attempts: []
  diagnosticMeasurementRef: ${{ steps.profile_baseline.output.measurementRef }}
  collectionStatus: ${{ steps.profile_baseline.output.collectionStatus }}
steps:
  - id: evaluate_baseline
    use: evaluator
    with:
      action: evaluate
      candidateRef: ${{ input.candidateRef }}
      caseIds: ${{ config.caseIds }}
    type: invoke
  - id: check_baseline
    use: selector
    with:
      incumbentMeasurementRef: ${{ steps.evaluate_baseline.output.measurementRef }}
      candidateMeasurementRef: ${{ steps.evaluate_baseline.output.measurementRef }}
    type: invoke
  - id: require_valid_baseline
    if: ${{ !steps.check_baseline.output.candidateFeasible }}
    then:
      steps:
        - id: invalid_baseline
          control: fail
          reason: Diagnostic precheck requires a valid baseline assessment.
          type: control
    type: if
  - id: profile_baseline
    use: evaluator
    with:
      action: profile
      candidateRef: ${{ input.candidateRef }}
      caseIds: ${{ config.caseIds }}
      assessmentMeasurementRef: ${{ steps.evaluate_baseline.output.measurementRef }}
    type: invoke

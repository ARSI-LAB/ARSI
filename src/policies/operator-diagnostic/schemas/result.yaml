type: object
additionalProperties: false
properties:
  bestCandidateRef:
    type: string
    minLength: 1
  bestMeasurementRef:
    type: string
    minLength: 1
  finalMeasurementRef:
    type: 'null'
  finalDecisionRef:
    type: 'null'
  finalValidity:
    const: not-run
  stopReason:
    const: diagnostic-only
  attempts:
    type: array
    maxItems: 0
  diagnosticMeasurementRef:
    type: string
    minLength: 1
  collectionStatus:
    enum: [completed, unavailable]
required:
  - bestCandidateRef
  - bestMeasurementRef
  - finalMeasurementRef
  - finalDecisionRef
  - finalValidity
  - stopReason
  - attempts
  - diagnosticMeasurementRef
  - collectionStatus

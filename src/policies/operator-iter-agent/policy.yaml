# Operator iterative optimization, agent channel (kernel source + config proposals).
# One agent invocation per round: the proposer binding answers "what is the next
# candidate" from last-round evidence, while this policy owns all mechanics in
# code (candidate versioning, validity gate, p50 selection, convergence).
#
# IMPORTANT: the selector's metricValue() rejects unavailable metrics, so the
# selector is only ever invoked behind the handle_evaluation gate that checks
# steps.evaluate.output.status == 'succeeded' — a failed measurement must never
# reach the selector.
schemaVersion: rsi.policy/v1
id: policy.operator-iter-agent
description: Agent-proposed candidates under the candidate-validity gate until convergence or budget exhaustion.
config_schema:
  $ref: ./schemas/agent-config.yaml
input_schema:
  $ref: ../../contracts/policies/candidate-input.yaml
output_schema:
  $ref: ./schemas/agent-result.yaml
state_schema:
  type: object
  additionalProperties: false
  properties:
    bestCandidate:
      type:
        - string
        - 'null'
    bestMeasurement:
      type:
        - string
        - 'null'
    bestValue:
      type:
        - number
        - 'null'
    staleRounds:
      type: integer
      minimum: 0
    history:
      type: array
      items:
        type: string
    # Cross-run memory artifact; null means "seed from the configured
    # host directory" (memory.agent seedDirectory).
    memoryRef:
      type:
        - string
        - 'null'
  required:
    - bestCandidate
    - bestMeasurement
    - bestValue
    - staleRounds
    - history
    - memoryRef
state:
  bestCandidate: null
  bestMeasurement: null
  bestValue: null
  staleRounds: 0
  history: []
  memoryRef: null
input:
  candidateRef: ${{ application.initialCandidate }}
require:
  proposer:
    contract: contract.proposer
  # The proposer binding's agentRef points at this backend binding.
  agentKernel:
    contract: contract.agent
  evaluator:
    contract: contract.operatorbench
  selector:
    contract: contract.selector-metrics
  # Finish-time reflection distills the run's rounds into the cross-run
  # memory wiki (rate-limited: one memory agent call per run).
  memoryUpdater:
    contract: contract.memory
  # Backend agent for the memoryUpdater binding (the kernel channel uses
  # agentKernel instead).
  agent:
    contract: contract.agent
defaults:
  bindings:
    selector:
      plugin: selector.metric
      config:
        # P50 is the adjudication metric per the design; per-case values
        # aggregate into a distribution, so a statistic is required here.
        metric: latencyMs
        statistic: p50
        direction: minimize
        # Eligibility gate: a candidate without a valid completed assessment
        # is infeasible and never participates in the performance comparison
        # (subsumes the old checksum hard gate - candidateValid requires
        # every check, checksum included, to pass).
        eligibility:
          - metric: candidateValid
            min: 1
steps:
  - id: search
    type: loop
    maxIterations: ${{ config.maxRounds }}
    while: ${{ state.staleRounds < config.convergeRounds }}
    steps:
      - id: propose
        type: invoke
        use: proposer
        with:
          # Proposals build on the incumbent; the first round starts from H0.
          parent: ${{ if(state.bestCandidate == null, input.candidateRef, state.bestCandidate) }}
          goal: ${{ config.goal }}
          evidenceRefs: ${{ state.history }}
          # The proposer consumes the cross-run memory wiki (null on fresh
          # deployments until the first reflection populates it).
          memoryRef: ${{ state.memoryRef }}
      - id: handle_proposal
        type: if
        if: ${{ steps.propose.output.status == 'created' }}
        then:
          steps:
            # Every candidate is measured; unmeasured candidates score nothing.
            - id: evaluate
              type: invoke
              use: evaluator
              with:
                action: evaluate
                candidateRef: ${{ steps.propose.output.candidateRef }}
                caseIds: ${{ config.caseIds }}
            # A candidate the evaluator could not measure (lifecycle precheck
            # rejection, NPU acquisition failure) arrives as a failed
            # measurement: it is never compared, and the round counts as stale
            # so the loop converges instead of crashing.
            - id: handle_evaluation
              type: if
              if: ${{ steps.evaluate.output.status == 'succeeded' }}
              then:
                steps:
                  # Self-comparison checks constraints before the first
                  # feasible incumbent.
                  - id: select
                    type: invoke
                    use: selector
                    with:
                      incumbentMeasurementRef: ${{ if(state.bestMeasurement == null, steps.evaluate.output.measurementRef, state.bestMeasurement) }}
                      candidateMeasurementRef: ${{ steps.evaluate.output.measurementRef }}
                  - id: record
                    type: state
                    state:
                      history: ${{ append(state.history, steps.evaluate.output.measurementRef) }}
                      staleRounds: ${{ if(steps.select.output.candidateFeasible && (state.bestMeasurement == null || steps.select.output.accepted), 0, state.staleRounds + 1) }}
                  - id: adopt
                    type: if
                    if: ${{ steps.select.output.candidateFeasible && (state.bestMeasurement == null || steps.select.output.accepted) }}
                    then:
                      steps:
                        - id: save_best
                          type: state
                          state:
                            bestCandidate: ${{ steps.propose.output.candidateRef }}
                            bestMeasurement: ${{ steps.evaluate.output.measurementRef }}
                            bestValue: ${{ steps.select.output.candidateValue }}
              else:
                steps:
                  - id: record_failed
                    type: state
                    state:
                      history: ${{ append(state.history, steps.evaluate.output.measurementRef) }}
                      staleRounds: ${{ state.staleRounds + 1 }}
        else:
          steps:
            - id: no_change
              type: state
              state:
                staleRounds: ${{ state.staleRounds + 1 }}
  - id: remember
    type: if
    if: ${{ size(state.history) > 0 }}
    then:
      steps:
        - id: call_memory
          type: invoke
          use: memoryUpdater
          with:
            memoryRef: ${{ state.memoryRef }}
            goal: >-
              Consolidate this run's kernel-optimization experience into the
              memory wiki - compile/precheck failure mechanisms with their
              named causes, tiling patterns that measured well, rejected
              candidate shapes. Preserve binding-contract rules; never invent
              measurements.
            evidenceRefs: ${{ state.history }}
        - id: save_memory
          type: state
          state:
            memoryRef: ${{ steps.call_memory.output.memoryRef }}
output:
  status: ${{ if(state.bestCandidate == null, 'no-feasible-configuration', 'selected') }}
  stopReason: ${{ if(state.staleRounds >= config.convergeRounds, 'converged', 'max-rounds') }}
  candidateRef: ${{ state.bestCandidate }}
  measurementRef: ${{ state.bestMeasurement }}
  bestValue: ${{ state.bestValue }}
  measurementRefs: ${{ state.history }}
  memoryRef: ${{ state.memoryRef }}

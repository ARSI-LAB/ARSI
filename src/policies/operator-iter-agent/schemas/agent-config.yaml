type: object
additionalProperties: false
properties:
  # Upper bound on agent proposals; budget.evaluationRuns should cover it.
  maxRounds:
    type: integer
    minimum: 1
    maximum: 1000
    default: 8
  # Early convergence: stop after this many consecutive rounds without an
  # accepted improvement (a no-change proposal counts as one round).
  convergeRounds:
    type: integer
    minimum: 1
    maximum: 1000
    default: 3
  # Optimization goal handed to the proposer binding each round.
  goal:
    type: string
    minLength: 1
  # Operator task case IDs evaluated per round (task.json of the evaluator's
  # task directory); the native kernel-opt flow measures every baseline case.
  caseIds:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
required:
  - goal
  - caseIds

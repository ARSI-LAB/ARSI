type: object
additionalProperties: false
properties:
  goal:
    type: string
    minLength: 1
  caseIds:
    type: array
    minItems: 1
    maxItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  maxAttempts:
    type: integer
    minimum: 1
    default: 3
  repairLimit:
    type: integer
    minimum: 0
    default: 3
  metricsEnabled:
    type: boolean
    default: false
  maxRounds:
    type: integer
    minimum: 1
    default: 10
  maxNoImprovement:
    type: integer
    minimum: 1
    default: 5
  baselinePreflight:
    type: boolean
    default: false
  metricsMode:
    enum:
      - profiler
      - measurement
      - hybrid
    default: hybrid
  infraRetry:
    type: object
    default:
      maxAttempts: 1
      backoffMs: 1000
    additionalProperties: false
    properties:
      maxAttempts:
        type: integer
        minimum: 1
        maximum: 5
        default: 1
      backoffMs:
        type: integer
        minimum: 0
        maximum: 60000
        default: 1000
  maxConsecutiveNoChange:
    type: integer
    minimum: 1
    default: 3
required:
  - goal
  - caseIds

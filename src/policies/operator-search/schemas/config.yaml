type: object
additionalProperties: false
properties:
  goal:
    type: string
    minLength: 1
  caseIds:
    type: array
    minItems: 1
    maxItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  maxAttempts:
    type: integer
    minimum: 1
    maximum: 3
    default: 3
  repairLimit:
    type: integer
    minimum: 0
    maximum: 3
    default: 3
  metricsEnabled:
    type: boolean
    default: false
  maxRounds:
    type: integer
    minimum: 1
    maximum: 10
    default: 10
  maxNoImprovement:
    type: integer
    minimum: 1
    maximum: 5
    default: 5
  evaluationTimeoutMs:
    type: integer
    minimum: 1
    default: 900000
  modelRequestTimeoutMs:
    type: integer
    minimum: 1
    default: 120000
  retrievalTimeoutMs:
    type: integer
    minimum: 1
    default: 300000
  cleanupReserveMs:
    type: integer
    minimum: 1
    default: 60000
required:
  - goal
  - caseIds

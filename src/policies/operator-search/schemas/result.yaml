type: object
additionalProperties: false
properties:
  bestCandidateRef:
    type: string
    minLength: 1
  bestMeasurementRef:
    type: string
    minLength: 1
  finalMeasurementRef:
    type: string
    minLength: 1
  finalDecisionRef:
    type: string
    minLength: 1
  finalValidity:
    enum:
      - valid
      - invalid
  finalTimingStable:
    type:
      - boolean
      - 'null'
  analysisRef:
    anyOf:
      - type: string
        minLength: 1
      - type: 'null'
  historyRef:
    anyOf:
      - type: string
        minLength: 1
      - type: 'null'
  attempts:
    type: array
    maxItems: 3
    items:
      type: object
      additionalProperties: false
      properties:
        attempt:
          type: integer
          minimum: 1
          maximum: 3
        candidateRefs:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            minLength: 1
        measurementRefs:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            minLength: 1
        decisionRef:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        summaryRef:
          type: string
          minLength: 1
        historyRef:
          type: string
          minLength: 1
        outcome:
          enum:
            - adopted
            - verified-no-gain
            - verification-failed
            - no-change
            - proposal-failed
        accepted:
          type: boolean
        repairCount:
          type: integer
          minimum: 0
          maximum: 3
      required:
        - attempt
        - candidateRefs
        - measurementRefs
        - decisionRef
        - summaryRef
        - historyRef
        - outcome
        - accepted
        - repairCount
  stopReason:
    enum:
      - max-attempts
      - accepted
      - no-static-issues
      - max-rounds
      - no-improvement
      - profiling-unavailable
  staticHistoryRef:
    anyOf:
      - type: string
        minLength: 1
      - type: 'null'
  metricsRounds:
    type: array
    maxItems: 10
    items:
      type: object
      additionalProperties: false
      properties:
        round:
          type: integer
          minimum: 1
          maximum: 10
        parentCandidateRef:
          type: string
          minLength: 1
        candidateRefs:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            minLength: 1
        measurementRefs:
          type: array
          maxItems: 4
          items:
            type: string
            minLength: 1
        decisionRef:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        summaryRef:
          type: string
          minLength: 1
        historyRef:
          type: string
          minLength: 1
        diagnosticMeasurementRef:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        candidateDiagnosticMeasurementRef:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        outcome:
          enum:
            - adopted
            - verified-no-gain
            - verification-failed
            - no-change
            - proposal-failed
        accepted:
          type: boolean
        repairCount:
          type: integer
          minimum: 0
          maximum: 3
      required:
        - round
        - parentCandidateRef
        - candidateRefs
        - measurementRefs
        - decisionRef
        - summaryRef
        - historyRef
        - diagnosticMeasurementRef
        - candidateDiagnosticMeasurementRef
        - outcome
        - accepted
        - repairCount
  diagnosticRefs:
    type: array
    maxItems: 11
    items:
      type: string
      minLength: 1
  noImprovementCount:
    type: integer
    minimum: 0
    maximum: 10
  phase:
    enum:
      - static
      - metrics
required:
  - bestCandidateRef
  - bestMeasurementRef
  - finalMeasurementRef
  - finalDecisionRef
  - finalValidity
  - finalTimingStable
  - analysisRef
  - historyRef
  - attempts
  - stopReason
  - staticHistoryRef
  - metricsRounds
  - diagnosticRefs
  - noImprovementCount
  - phase

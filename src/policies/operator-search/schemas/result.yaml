type: object
additionalProperties: false
properties:
  bestCandidateRef:
    type: string
    minLength: 1
  bestMeasurementRef:
    anyOf:
      - type: string
        minLength: 1
      - type: 'null'
  finalMeasurementRef:
    anyOf:
      - type: string
        minLength: 1
      - type: 'null'
  finalDecisionRef:
    anyOf:
      - type: string
        minLength: 1
      - type: 'null'
  finalValidity:
    enum:
      - valid
      - invalid
      - unknown
      - baseline-invalid
  finalTimingStable:
    type:
      - boolean
      - 'null'
  effectiveTolerance:
    anyOf:
      - type: object
        additionalProperties: false
        properties:
          mode:
            enum:
              - explicit
              - dtype
              - observed
              - frozen
          rtol:
            type: number
            minimum: 0
          atol:
            type: number
            minimum: 0
          source:
            type: string
            minLength: 1
          observedMaxAbs:
            type: number
            minimum: 0
        required:
          - mode
          - rtol
          - atol
          - source
      - type: 'null'
  baselineDiagnostic:
    anyOf:
      - type: object
        additionalProperties: false
        properties:
          dtype:
            type:
              - string
              - 'null'
          errorStats:
            anyOf:
              - type: object
                additionalProperties:
                  type: number
                  minimum: 0
              - type: 'null'
          suggestedTolerance:
            type: object
            additionalProperties: false
            properties:
              mode:
                enum:
                  - explicit
                  - dtype
                  - frozen
              rtol:
                type: number
                minimum: 0
              atol:
                type: number
                minimum: 0
              safetyFactor:
                type: number
                exclusiveMinimum: 0
            required:
              - mode
              - rtol
              - atol
        required:
          - dtype
          - errorStats
          - suggestedTolerance
      - type: 'null'
  analysisRef:
    anyOf:
      - type: string
        minLength: 1
      - type: 'null'
  historyRef:
    anyOf:
      - type: string
        minLength: 1
      - type: 'null'
  attempts:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        attempt:
          type: integer
          minimum: 1
        candidateRefs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        measurementRefs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        decisionRef:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        summaryRef:
          type: string
          minLength: 1
        historyRef:
          type: string
          minLength: 1
        outcome:
          enum:
            - adopted
            - verified-no-gain
            - verification-failed
            - no-change
            - proposal-failed
        accepted:
          type: boolean
        repairCount:
          type: integer
          minimum: 0
      required:
        - attempt
        - candidateRefs
        - measurementRefs
        - decisionRef
        - summaryRef
        - historyRef
        - outcome
        - accepted
        - repairCount
  stopReason:
    enum:
      - max-attempts
      - accepted
      - no-static-issues
      - max-rounds
      - no-improvement
      - no-new-hypothesis
      - consecutive-no-change
      - profiling-unavailable
      - metrics-unavailable
      - baseline-invalid
      - infra-failure
  staticHistoryRef:
    anyOf:
      - type: string
        minLength: 1
      - type: 'null'
  metricsRounds:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        round:
          type: integer
          minimum: 1
        parentCandidateRef:
          type: string
          minLength: 1
        candidateRefs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        measurementRefs:
          type: array
          items:
            type: string
            minLength: 1
        decisionRef:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        summaryRef:
          type: string
          minLength: 1
        historyRef:
          type: string
          minLength: 1
        diagnosticMeasurementRef:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        candidateDiagnosticMeasurementRef:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        outcome:
          enum:
            - adopted
            - verified-no-gain
            - verification-failed
            - no-change
            - proposal-failed
        accepted:
          type: boolean
        repairCount:
          type: integer
          minimum: 0
      required:
        - round
        - parentCandidateRef
        - candidateRefs
        - measurementRefs
        - decisionRef
        - summaryRef
        - historyRef
        - diagnosticMeasurementRef
        - candidateDiagnosticMeasurementRef
        - outcome
        - accepted
        - repairCount
  diagnosticRefs:
    type: array
    items:
      type: string
      minLength: 1
  noImprovementCount:
    type: integer
    minimum: 0
  consecutiveNoChangeCount:
    type: integer
    minimum: 0
  phase:
    enum:
      - baseline
      - static
      - metrics
required:
  - bestCandidateRef
  - bestMeasurementRef
  - finalMeasurementRef
  - finalDecisionRef
  - finalValidity
  - finalTimingStable
  - analysisRef
  - historyRef
  - attempts
  - stopReason
  - staticHistoryRef
  - metricsRounds
  - diagnosticRefs
  - noImprovementCount
  - consecutiveNoChangeCount
  - phase

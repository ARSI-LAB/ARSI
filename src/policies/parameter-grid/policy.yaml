schemaVersion: rsi.policy/v1
id: policy.parameter-grid
description: Search a parameter grid and select candidates by measured metrics.
input_schema:
  $ref: ../../contracts/policies/candidate-input.yaml
input:
  candidateRef: ${{ application.initialCandidate }}
config_schema:
  $ref: ./schemas/config.yaml
state_schema:
  type: object
  properties:
    cursor:
      type: integer
      minimum: 0
    exhausted:
      type: boolean
    bestCandidate:
      type:
        - string
        - 'null'
    bestMeasurement:
      type:
        - string
        - 'null'
    bestParameters:
      type:
        - object
        - 'null'
    history:
      type: array
      items:
        type: string
  required:
    - cursor
    - exhausted
    - bestCandidate
    - bestMeasurement
    - bestParameters
    - history
  additionalProperties: false
state:
  cursor: 0
  exhausted: false
  bestCandidate: null
  bestMeasurement: null
  bestParameters: null
  history: []
output_schema:
  $ref: ./schemas/result.yaml
require:
  proposer:
    contract: contract.proposer-grid
  evaluator:
    contract: contract.inferencebench
  selector:
    contract: contract.selector-metrics
defaults:
  bindings:
    proposer:
      plugin: proposer.grid
    selector:
      plugin: selector.metric
      config:
        metric: requestThroughput
        direction: maximize
        constraints:
          - metric: sloSatisfied
            min: 1
steps:
  - id: search
    type: loop
    maxIterations: ${{ get(config, 'maxCandidates', null) }}
    while: ${{ !state.exhausted }}
    steps:
      - id: propose
        type: invoke
        use: proposer
        with:
          parent: ${{ input.candidateRef }}
          cursor: ${{ state.cursor }}
      - id: handle_proposal
        type: if
        if: ${{ steps.propose.output.status == 'candidate' }}
        then:
          steps:
            # A grid point equal to the baseline still needs measurement.
            - id: evaluate
              type: invoke
              use: evaluator
              with:
                candidateRef: ${{ steps.propose.output.candidateRef }}
            # Self-comparison checks constraints before the first feasible incumbent.
            - id: select
              type: invoke
              use: selector
              with:
                incumbentMeasurementRef: ${{ if(state.bestMeasurement == null,
                  steps.evaluate.output.measurementRef, state.bestMeasurement)
                  }}
                candidateMeasurementRef: ${{ steps.evaluate.output.measurementRef }}
            - id: record
              type: state
              state:
                cursor: ${{ steps.propose.output.nextCursor }}
                exhausted: ${{ steps.propose.output.nextCursor >=
                  steps.propose.output.totalCandidates }}
                history: ${{ append(state.history, steps.evaluate.output.measurementRef) }}
            - id: adopt
              type: if
              if:
                ${{ steps.select.output.candidateFeasible && (state.bestMeasurement == null
                || steps.select.output.accepted) }}
              then:
                steps:
                  - id: save_best
                    type: state
                    state:
                      bestCandidate: ${{ steps.propose.output.candidateRef }}
                      bestMeasurement: ${{ steps.evaluate.output.measurementRef }}
                      bestParameters: ${{ steps.propose.output.parameters }}
        else:
          steps:
            - id: exhausted
              type: state
              state:
                exhausted: true
output:
  status: ${{ if(state.bestCandidate == null, 'no-feasible-configuration',
    'selected') }}
  stopReason: ${{ if(state.exhausted, 'search-exhausted', 'max-candidates') }}
  candidateRef: ${{ state.bestCandidate }}
  measurementRef: ${{ state.bestMeasurement }}
  parameters: ${{ state.bestParameters }}
  measurementRefs: ${{ state.history }}

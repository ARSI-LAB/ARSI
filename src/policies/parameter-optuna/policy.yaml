schemaVersion: rsi.policy/v1
id: policy.parameter-optuna
description: Optimize parameters with Optuna proposals and metric-based candidate selection.
config_schema:
  $ref: ./schemas/config.yaml
input_schema:
  $ref: ../../contracts/policies/candidate-input.yaml
output_schema:
  $ref: ./schemas/result.yaml
input:
  candidateRef: ${{ application.initialCandidate }}
require:
  proposer:
    contract: contract.proposer-parameter-search
  evaluator:
    contract: contract.inferencebench
  selector:
    contract: contract.selector-metrics
defaults:
  bindings:
    proposer:
      ref: proposer.optuna
    selector:
      ref: selector.metric
      config:
        metric: requestThroughput
        direction: maximize
        constraints:
          - metric: sloSatisfied
            min: 1
init:
  steps:
    - id: initialize_search
      use: proposer
      with:
        action: initialize
        parent: ${{ input.candidateRef }}
    - id: initialize
      state:
        searchStateRef: ${{ init.initialize_search.output.stateRef }}
        stopped: false
        stopReason: max-trials
        bestCandidate: null
        bestMeasurement: null
        bestParameters: null
        history: []
loop:
  maxIterations: ${{ config.maxTrials }}
  while: ${{ !state.stopped }}
  steps:
    - id: propose
      use: proposer
      with:
        action: suggest
        stateRef: ${{ state.searchStateRef }}
    - id: handle_proposal
      if: ${{ loop.propose.output.status == 'candidate' }}
      then:
        - id: evaluate
          use: evaluator
          with:
            candidateRef: ${{ loop.propose.output.candidateRef }}
        - id: select
          use: selector
          with:
            incumbentMeasurementRef: ${{ if(state.bestMeasurement == null, loop.evaluate.output.measurementRef, state.bestMeasurement) }}
            candidateMeasurementRef: ${{ loop.evaluate.output.measurementRef }}
        # Every complete measurement is feedback, including rejected candidates.
        - id: observe
          use: proposer
          with:
            action: observe
            stateRef: ${{ loop.propose.output.stateRef }}
            trialId: ${{ loop.propose.output.trialId }}
            measurementRef: ${{ loop.evaluate.output.measurementRef }}
            decisionRef: ${{ loop.select.output.decisionRef }}
        - id: record
          state:
            searchStateRef: ${{ loop.observe.output.stateRef }}
            history: ${{ append(state.history, loop.evaluate.output.measurementRef) }}
        - id: adopt
          if: ${{ loop.select.output.candidateFeasible && (state.bestMeasurement == null || loop.select.output.accepted) }}
          then:
            - id: save_best
              state:
                bestCandidate: ${{ loop.propose.output.candidateRef }}
                bestMeasurement: ${{ loop.evaluate.output.measurementRef }}
                bestParameters: ${{ loop.propose.output.parameters }}
      else:
        - id: stop
          state:
            searchStateRef: ${{ loop.propose.output.stateRef }}
            stopped: true
            stopReason: ${{ loop.propose.output.reason }}
output:
  status: ${{ if(state.bestCandidate == null, 'no-feasible-configuration', 'selected') }}
  stopReason: ${{ state.stopReason }}
  candidateRef: ${{ state.bestCandidate }}
  measurementRef: ${{ state.bestMeasurement }}
  parameters: ${{ state.bestParameters }}
  measurementRefs: ${{ state.history }}
  searchStateRef: ${{ state.searchStateRef }}

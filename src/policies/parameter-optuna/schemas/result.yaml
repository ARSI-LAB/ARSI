type: object
additionalProperties: false
properties:
  status:
    enum: [selected, no-feasible-configuration]
  stopReason:
    enum: [search-exhausted, sampling-limit, max-trials]
  candidateRef:
    type: [string, 'null']
  measurementRef:
    type: [string, 'null']
  parameters:
    type: [object, 'null']
    additionalProperties: true
  measurementRefs:
    type: array
    items:
      type: string
  searchStateRef:
    type: string
required:
  - status
  - stopReason
  - candidateRef
  - measurementRef
  - parameters
  - measurementRefs
  - searchStateRef

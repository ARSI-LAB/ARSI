schemaVersion: rsi.policy/v1
id: parameter.agent
description: Search configuration candidates with Agent proposals, measured selection and optional learning.
# policy schema
input_schema:
  $ref: ../../../contracts/policies/candidate-input.yaml
input:
  candidateRef: ${{ application.initialCandidate }}
output_schema:
  $ref: ./schemas/result.yaml
config_schema:
  $ref: ./schemas/config.yaml

# setup
state_schema:
  $ref: ./setup.yaml#/state_schema
state:
  $ref: ./setup.yaml#/state
require:
  $ref: ./setup.yaml#/require
defaults:
  $ref: ./setup.yaml#/defaults

# policy steps
steps:
  - id: baseline
    type: invoke
    use: evaluator
    with:
      candidateRef: ${{ input.candidateRef }}
  - id: baseline_feasibility
    type: invoke
    use: selector
    with:
      incumbentMeasurementRef: ${{ steps.baseline.output.measurementRef }}
      candidateMeasurementRef: ${{ steps.baseline.output.measurementRef }}
  - id: start_search
    type: state
    state:
      incumbent: ${{ input.candidateRef }}
      incumbentMeasurement: ${{ steps.baseline.output.measurementRef }}
      incumbentFeasible: ${{ steps.baseline_feasibility.output.candidateFeasible }}
      sources:
        - candidateRef: ${{ input.candidateRef }}
  - id: search
    type: loop
    maxIterations: ${{ config.maxTrials }}
    while: ${{ length(state.trials) < config.maxTrials }}
    steps:
      - id: propose
        type: invoke
        use: proposer
        with:
          parent: ${{ state.incumbent }}
          memoryRef: ${{ state.memoryRef }}
          goal: ${{ config.goal }}
          maxCandidates: >-
            ${{ if(config.candidatesPerRound < config.maxTrials - length(state.trials),
            config.candidatesPerRound, config.maxTrials - length(state.trials)) }}
          evidenceRefs: ${{ compact(concat(append(range(0, 0), steps.baseline.output.measurementRef), pluck(state.trials, 'measurementRef'))) }}
          sources: ${{ state.sources }}
          observations:
            baselineCandidateRef: ${{ input.candidateRef }}
            baselineMeasurementRef: ${{ steps.baseline.output.measurementRef }}
            incumbentMeasurementRef: ${{ state.incumbentMeasurement }}
            trials: ${{ state.trials }}
            selection: ${{ config.selection }}
            previousNoChangeReason: ${{ state.previousNoChangeReason }}
          editConstraints:
            allowedPaths: ['${{ config.parameterFile }}']
            maxChangedFiles: 1
      - id: candidates
        type: if
        if: ${{ steps.propose.output.status == 'no-change' }}
        then:
          steps:
            - id: no_change
              type: state
              state:
                previousNoChangeReason: ${{ steps.propose.output.rationale }}
          output: []
        else:
          steps:
            - id: clear_no_change
              type: state
              state: { previousNoChangeReason: null }
          output: >-
            ${{ if(steps.propose.output.status == 'batch',
            pluck(steps.propose.output.candidates, 'candidateRef'),
            append(range(0, 0), steps.propose.output.candidateRef)) }}
      - id: evaluate_batch
        type: loop
        maxIterations: ${{ length(steps.candidates.output) }}
        while: ${{ length(state.trials) < config.maxTrials }}
        steps:
          $ref: ./trial-steps.yaml#/evaluate
      - id: remember_if_enabled
        type: if
        if: ${{ config.memory && length(steps.candidates.output) > 0 }}
        then:
          steps:
            - id: remember
              type: invoke
              use: memoryUpdater
              with:
                memoryRef: ${{ state.memoryRef }}
                goal: Consolidate measured configuration-search experience, preserving sources, counterexamples and applicability conditions.
                evidenceRefs: ${{ compact(concat(append(range(0, 0), steps.baseline.output.measurementRef), pluck(state.trials, 'measurementRef'))) }}
                sources: ${{ state.sources }}
                observations:
                  baselineCandidateRef: ${{ input.candidateRef }}
                  baselineMeasurementRef: ${{ steps.baseline.output.measurementRef }}
                  incumbentCandidateRef: ${{ state.incumbent }}
                  incumbentMeasurementRef: ${{ state.incumbentMeasurement }}
                  proposals: ${{ steps.propose.output }}
                  trials: ${{ state.trials }}
                  selection: ${{ config.selection }}
            - id: save_memory
              type: state
              state:
                memoryRef: ${{ steps.remember.output.memoryRef }}
      - id: finish_round
        type: state
        state:
          proposalRounds: ${{ state.proposalRounds + 1 }}
      - id: reflect_if_enabled
        type: if
        if: ${{ config.reflection && length(state.trials) < config.maxTrials && state.proposalRounds < config.maxTrials }}
        then:
          steps:
            - id: improve_guidance
              type: reflection

# output
output:
  status: ${{ if(state.incumbentFeasible, 'selected', 'no-feasible-configuration') }}
  stopReason: >-
    ${{ if(length(state.trials) >= config.maxTrials, 'max-trials',
    if(state.proposalRounds >= config.maxTrials, 'max-proposal-rounds', null)) }}
  baselineCandidateRef: ${{ input.candidateRef }}
  baselineMeasurementRef: ${{ steps.baseline.output.measurementRef }}
  candidateRef: ${{ state.incumbent }}
  measurementRef: ${{ state.incumbentMeasurement }}
  candidateFeasible: ${{ state.incumbentFeasible }}
  memoryRef: ${{ state.memoryRef }}
  trials: ${{ state.trials }}

state_schema:
  type: object
  additionalProperties: false
  properties:
    incumbent: { type: [string, 'null'] }
    incumbentMeasurement: { type: [string, 'null'] }
    incumbentFeasible: { type: boolean }
    memoryRef: { type: [string, 'null'] }
    previousNoChangeReason: { type: [string, 'null'] }
    sources: { type: array, items: { type: object } }
    trials:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          candidateRef: { type: string }
          measurementRef: { type: string, minLength: 1 }
          status: { const: measured }
          reason: { type: string }
          accepted: { type: boolean }
          candidateFeasible: { type: boolean }
        required:
          [
            candidateRef,
            measurementRef,
            status,
            reason,
            accepted,
            candidateFeasible,
          ]
  required:
    [
      incumbent,
      incumbentMeasurement,
      incumbentFeasible,
      memoryRef,
      previousNoChangeReason,
      trials,
      sources,
    ]
state:
  incumbent: null
  incumbentMeasurement: null
  incumbentFeasible: false
  memoryRef: null
  previousNoChangeReason: null
  trials: []
  sources: []
require:
  proposer: { contract: contract.proposer }
  evaluator: { contract: contract.inferencebench }
  selector: { contract: contract.selector-metrics }
  agent: { contract: contract.agent }
  memoryUpdater: { contract: contract.memory }
defaults:
  reflection: { configFile: ./reflection.yaml }
  bindings:
    agent: { plugin: agent.codex }
    proposer:
      plugin: proposer.agent
      config: { agentRef: agent, prompt: ./prompt.md, guidance: ./guidance }
    memoryUpdater:
      plugin: memory.agent
      config:
        agentRef: agent
        prompt: ./memory.md
        evidenceView: training-summary
    selector:
      plugin: selector.inference
      config: { metric: requestThroughput, direction: maximize }
